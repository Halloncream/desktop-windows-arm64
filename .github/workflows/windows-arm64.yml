name: Windows ARM64 compatibility build

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-arm64-python]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: open-webui-windows-arm64
          path: dist/*-arm64-setup.exe
          if-no-files-found: error
